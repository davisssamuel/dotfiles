# Backend
backend = "glx";

# Rounded corners
corner-radius = 10;
rounded-corners-exclude = [
	"class_g = 'dwm'",
	"class_g = 'dmenu'",
];

# Shadows
shadow = true;
shadow-radius = 5
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.8
shadow-color = "#000000"
shadow-exclude = [
	"class_g = 'dwm'",
	"class_g = 'dmenu'",
];

# Window rules
rules = ({
	match = "window_type = 'tooltip'    || "
		"window_type = 'menu'	    || "
		"window_type = 'popup_menu' || "
		"window_type = 'dropdown_menu'"
	shadow = true;
	full-shadow = false;
})
